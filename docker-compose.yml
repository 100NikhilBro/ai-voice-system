version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health_insurance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: health_insurance_kb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_insurance_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
